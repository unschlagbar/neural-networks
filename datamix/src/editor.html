<!doctype html>
<meta charset="utf-8">
<title>SFT editor</title>
<style>
:root{
  --bg:#14161a; --panel:#1b1e24; --line:#2a2f38; --fg:#dfe3ea; --dim:#8b93a1;
  --acc:#7aa2f7; --loss:#2d4a33; --marker:#c08a3e; --warn:#e0605e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
header .grow{flex:1}
button{background:#252a33;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:5px 10px;cursor:pointer;font:inherit}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);color:#10131a;border-color:var(--acc);font-weight:600}
button.icon{padding:2px 7px;color:var(--dim)}
#status{color:var(--dim);font-size:12px;max-width:52ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status.err{color:var(--warn)}
main{flex:1;display:flex;min-height:0}
#list{width:290px;border-right:1px solid var(--line);overflow-y:auto;background:var(--panel)}
#list .item{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12px}
#list .item:hover{background:#222732}
#list .item.sel{background:#232b3a;box-shadow:inset 3px 0 0 var(--acc)}
#list .item .t{color:var(--dim);font-size:11px;display:flex;justify-content:space-between}
#list .item .p{margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#edit{flex:1;overflow-y:auto;padding:14px 16px;min-width:0}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
input,select,textarea{background:#111419;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font:inherit}
textarea{width:100%;resize:vertical;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;overflow-x:auto}
.turn{border:1px solid var(--line);border-radius:7px;padding:8px;margin-bottom:9px;background:var(--panel)}
.turn.user{border-left:3px solid #5f8f5f}
.turn.assistant{border-left:3px solid var(--acc)}
.turn.tool{border-left:3px solid var(--marker)}
.turn.system{border-left:3px solid #8a6fb0}
.turn.assistant_context{border-left:3px solid #5a6270}
.turn .hd{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.turn .hd .grow{flex:1;color:var(--dim);font-size:11px;text-align:right}
h3{margin:18px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
pre#wire{background:#111419;border:1px solid var(--line);border-radius:7px;padding:10px;white-space:pre-wrap;word-break:break-word;font:13px/1.6 ui-monospace,Menlo,monospace;margin:0}
pre#wire .m{color:var(--marker);font-weight:700}
pre#wire .loss{background:var(--loss);border-radius:2px}
pre#wire .ws{color:#454c58}
#warn{margin-top:10px}
#warn div{color:var(--warn);font-size:12px;margin-top:3px}
.empty{color:var(--dim);padding:40px;text-align:center}
label.chk{color:var(--dim);font-size:12px;display:flex;gap:5px;align-items:center;cursor:pointer}
label.chk.train{color:#7fc08a;background:var(--loss);border-radius:4px;padding:2px 7px}
.turn.assistant_context label.chk.train{color:var(--dim);background:#22262e}
.turn.assistant_context textarea{color:var(--dim)}
.masks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px}
.maskbar{display:flex;gap:6px}
.chip{font-size:12px;color:var(--dim);background:#22262e;border:1px dashed var(--line);border-radius:4px;padding:2px 7px;cursor:pointer;text-decoration:line-through;max-width:46ch;overflow:hidden;white-space:nowrap}
.chip:hover{border-color:var(--acc);color:var(--fg)}
#legend{color:var(--dim);font-size:12px;margin:6px 0 0}
#legend b{background:var(--loss);color:#7fc08a;padding:1px 5px;border-radius:3px;font-weight:400}
</style>

<header>
  <button id="new-chat">+ conversation</button>
  <button id="new-sft">+ single turn</button>
  <button id="dup">duplicate</button>
  <button id="del">delete</button>
  <span class="grow"></span>
  <span id="status"></span>
  <label class="chk"><input type="checkbox" id="ws"> show spaces</label>
  <button id="save" class="primary">save (ctrl+s)</button>
</header>
<main>
  <div id="list"></div>
  <div id="edit"></div>
</main>

<script>
// SFT_MAX_WORDS / SFT_MAX_TOKENS in src/config.rs.
const MAX_WORDS = 4096, MAX_TOKENS = 28672;
// `assistant_context` is not offered as a role: it is the "train on this"
// checkbox of an assistant turn, which is what a loss mask actually is.
const ROLES = ["user", "assistant", "tool", "system"];
let records = [];
let sel = 0;
let dirty = false;

const $ = (id) => document.getElementById(id);
const enc = new TextEncoder();
const bytes = (s) => enc.encode(s).length;

function setStatus(msg, err) {
  $("status").textContent = msg;
  $("status").className = err ? "err" : "";
}
function markDirty() { dirty = true; renderList(); }

// file <-> records

function parse(text) {
  const out = [];
  for (const line of text.split("\n")) {
    if (!line.trim()) continue;
    let o;
    try { o = JSON.parse(line); } catch { setStatus("skipped an unparsable line", true); continue; }
    if (Array.isArray(o.messages)) {
      out.push({
        kind: "chat",
        category: o.category || "",
        turns: o.messages.map((m) => {
          const content = m.content || "";
          return {
            role: m.role || "user",
            content,
            // The file counts bytes; a textarea counts UTF-16 units.
            no_loss: (m.no_loss || []).map(([a, b]) => [idxOfByte(content, a), idxOfByte(content, b)]),
          };
        }),
      });
    } else {
      out.push({
        kind: "sft",
        category: o.category || "",
        instruction: o.instruction || "",
        context: o.context || "",
        response: o.response || "",
      });
    }
  }
  return out;
}

function serialize() {
  return records.map((r) => r.kind === "chat"
    ? JSON.stringify({ messages: r.turns.map(msg), category: r.category })
    : JSON.stringify({ instruction: r.instruction, context: r.context, response: r.response, category: r.category })
  ).join("\n") + (records.length ? "\n" : "");
}

function msg(t) {
  const m = { role: t.role, content: t.content };
  if (t.role === "assistant" && t.no_loss && t.no_loss.length) {
    m.no_loss = t.no_loss.map(([a, b]) => [byteOfIdx(t.content, a), byteOfIdx(t.content, b)]);
  }
  return m;
}

const byteOfIdx = (s, i) => bytes(s.slice(0, i));
function idxOfByte(s, b) {
  let n = 0, i = 0;
  for (const ch of s) {
    if (n >= b) return i;
    n += bytes(ch);
    i += ch.length;
  }
  return s.length;
}

// Loss masks inside one turn. Ranges are half-open, sorted and non-overlapping;
// `mask_pieces` in src/sft.rs normalizes whatever it is given the same way.
function normalize(ranges) {
  const rs = ranges.filter(([a, b]) => b > a).sort((x, y) => x[0] - y[0]);
  const out = [];
  for (const [a, b] of rs) {
    const last = out[out.length - 1];
    if (last && a <= last[1]) last[1] = Math.max(last[1], b);
    else out.push([a, b]);
  }
  return out;
}

function subtract(ranges, s, e) {
  return normalize(ranges.flatMap(([a, b]) => [[a, Math.min(b, s)], [Math.max(a, e), b]]));
}

// Grow a selection out to word borders — the unit the mask is really applied
// in, since `segment::word_ends` cuts there and attaches a whitespace run as
// the suffix of the word before it.
function snap(text, s, e) {
  while (s > 0 && !/\s/.test(text[s - 1])) s--;
  while (e < text.length && !/\s/.test(text[e])) e++;
  while (e < text.length && /\s/.test(text[e])) e++;
  return [s, e];
}

function maskPieces(content, ranges) {
  const text = content.trim();
  if (!ranges.length || !text) return [[text, true]];
  const off = content.length - content.trimStart().length;
  const cl = (x) => Math.max(0, Math.min(text.length, x - off));
  const rs = normalize(ranges.map(([a, b]) => [cl(a), cl(b)]));
  const out = [];
  let at = 0;
  for (const [a, b] of rs) {
    if (a > at) out.push([text.slice(at, a), true]);
    out.push([text.slice(a, b), false]);
    at = b;
  }
  if (at < text.length) out.push([text.slice(at), true]);
  return out;
}

// An edit to the content moves everything after it; keep the ranges pinned to
// the text they were drawn around instead of making the user redraw them.
function shiftMasks(t, before, after) {
  if (!t.no_loss.length) return;
  const min = Math.min(before.length, after.length);
  let p = 0;
  while (p < min && before[p] === after[p]) p++;
  let sfx = 0;
  while (sfx < min - p && before[before.length - 1 - sfx] === after[after.length - 1 - sfx]) sfx++;
  const cutEnd = before.length - sfx, d = after.length - before.length;
  const adj = (x) => (x <= p ? x : x >= cutEnd ? x + d : p);
  t.no_loss = normalize(t.no_loss.map(([a, b]) => [adj(a), adj(b)]));
}

// The wire form, mirroring build_conversation in src/sft.rs: a system message
// takes the first user turn's <CONTEXT> slot, a tool result re-opens the
// prompt, and a trailing prompt with no answer after it is cut at load.
function assemble(rec) {
  const seg = [];
  const push = (text, cls) => text && seg.push({ text, cls });
  const warn = [];
  if (rec.kind === "sft") {
    const ins = rec.instruction.trim(), ctx = rec.context.trim(), res = rec.response.trim();
    if (!ins) warn.push("no instruction");
    if (!res) warn.push("no response — nothing carries loss");
    push(ins, "");
    if (ctx) { push("<CONTEXT>", "m"); push(ctx, ""); }
    push("<SEP>", "m");
    push(res, "loss");
    push("<END>", "m loss");
    return { seg, warn };
  }
  let system = "", open = false, lastLoss = 0, anyLoss = false;
  rec.turns.forEach((t, i) => {
    const c = t.content.trim();
    if (!c) { warn.push(`turn ${i + 1} (${t.role}) is empty and is dropped`); return; }
    if (t.role === "system") {
      if (i > 0 && rec.turns.slice(0, i).some((p) => p.role === "user"))
        warn.push(`turn ${i + 1}: a system message after the first user turn is dropped`);
      system = c;
    } else if (t.role === "user") {
      push(c, "");
      if (system) { push("<CONTEXT>", "m"); push(system, ""); system = ""; }
      push("<SEP>", "m");
      open = true;
    } else if (t.role === "tool") {
      if (open) { warn.push(`turn ${i + 1}: a tool result needs an assistant turn (the call) before it — dropped`); return; }
      push("<result>", "m"); push(c, ""); push("</result>", "m"); push("<SEP>", "m");
      open = true;
    } else {
      if (!open) { warn.push(`turn ${i + 1}: an assistant turn with no prompt before it is dropped`); return; }
      const trained = t.role === "assistant";
      let any = false;
      for (const [piece, keep] of maskPieces(t.content, trained ? t.no_loss : [])) {
        push(piece, keep && trained ? "loss" : "");
        if (keep && trained && piece.trim()) any = true;
      }
      push("<END>", any ? "m loss" : "m");
      open = false;
      if (any) { anyLoss = true; lastLoss = seg.length; }
      else if (trained && t.no_loss.length)
        warn.push(`turn ${i + 1}: every part of this answer is masked — it trains nothing`);
    }
  });
  if (open) {
    warn.push("the last prompt has no answer after it — everything from it on is cut at load");
    seg.length = lastLoss;
  }
  if (!anyLoss) warn.push("no assistant turn carries loss — this record is dropped entirely");
  return { seg, warn };
}

// rendering

function preview(rec) {
  if (rec.kind === "sft") return rec.instruction || "(empty)";
  const first = rec.turns.find((t) => t.role === "user");
  return (first && first.content) || rec.turns[0]?.content || "(empty)";
}

function renderList() {
  const el = $("list");
  el.innerHTML = "";
  records.forEach((r, i) => {
    const d = document.createElement("div");
    d.className = "item" + (i === sel ? " sel" : "");
    const trained = r.kind === "chat"
      ? r.turns.filter((t) => t.role === "assistant").length
      : 1;
    const masked = r.kind === "chat"
      ? r.turns.filter((t) => t.no_loss && t.no_loss.length).length
      : 0;
    const n = r.kind === "chat"
      ? `${r.turns.length} turns · ${trained} trained${masked ? ` · ${masked} masked` : ""}`
      : "single";
    const t = document.createElement("div");
    t.className = "t";
    t.append(
      Object.assign(document.createElement("span"), { textContent: `#${i + 1} · ${n}` }),
      Object.assign(document.createElement("span"), { textContent: r.category || "" }),
    );
    d.appendChild(t);
    const p = document.createElement("div");
    p.className = "p";
    p.textContent = preview(r);
    d.appendChild(p);
    d.onclick = () => { sel = i; render(); };
    el.appendChild(d);
  });
  document.title = (dirty ? "• " : "") + `SFT editor — ${records.length} records`;
}

function autosize(ta) {
  ta.style.height = "auto";
  ta.style.height = Math.min(ta.scrollHeight + 2, 520) + "px";
}

function field(label, value, oninput) {
  const wrap = document.createElement("div");
  wrap.className = "row";
  wrap.style.alignItems = "flex-start";
  const l = document.createElement("div");
  l.style.cssText = "width:92px;color:var(--dim);font-size:12px;padding-top:7px";
  l.textContent = label;
  const ta = document.createElement("textarea");
  ta.value = value;
  ta.rows = 2;
  ta.oninput = () => { oninput(ta.value); autosize(ta); markDirty(); renderWire(); };
  wrap.append(l, ta);
  setTimeout(() => autosize(ta));
  return wrap;
}

function render() {
  renderList();
  const el = $("edit");
  el.innerHTML = "";
  const rec = records[sel];
  if (!rec) { el.innerHTML = '<div class="empty">no record selected — add one above</div>'; return; }

  const head = document.createElement("div");
  head.className = "row";
  const cat = document.createElement("input");
  cat.value = rec.category;
  cat.placeholder = "category";
  cat.oninput = () => { rec.category = cat.value; markDirty(); };
  head.append(Object.assign(document.createElement("span"), { textContent: "category", style: "color:var(--dim);font-size:12px" }), cat);
  el.appendChild(head);

  if (rec.kind === "sft") {
    el.appendChild(field("instruction", rec.instruction, (v) => rec.instruction = v));
    el.appendChild(field("context", rec.context, (v) => rec.context = v));
    el.appendChild(field("response", rec.response, (v) => rec.response = v));
  } else {
    rec.turns.forEach((t, i) => el.appendChild(turnEl(rec, t, i)));
    const add = document.createElement("button");
    add.textContent = "+ turn";
    add.onclick = () => {
      const last = rec.turns[rec.turns.length - 1];
      rec.turns.push({ role: last && last.role === "user" ? "assistant" : "user", content: "", no_loss: [] });
      markDirty(); render();
    };
    el.appendChild(add);
  }

  const h = document.createElement("h3");
  h.textContent = "wire form — what the trainer sees";
  el.appendChild(h);
  const pre = document.createElement("pre");
  pre.id = "wire";
  el.appendChild(pre);
  const leg = document.createElement("p");
  leg.id = "legend";
  leg.innerHTML = '<b>green</b> = trained on (gradient flows); everything else is context the model only reads. ' +
    'Select inside an assistant turn and press <i>don\u2019t train selection</i> to mask part of an answer.';
  el.appendChild(leg);
  const w = document.createElement("div");
  w.id = "warn";
  el.appendChild(w);
  renderWire();
}

function turnEl(rec, t, i) {
  const d = document.createElement("div");
  d.className = "turn " + t.role;
  const hd = document.createElement("div");
  hd.className = "hd";
  const isAsst = t.role === "assistant" || t.role === "assistant_context";
  const sel2 = document.createElement("select");
  ROLES.forEach((r) => sel2.append(new Option(r, r)));
  sel2.value = isAsst ? "assistant" : t.role;
  sel2.onchange = () => { t.role = sel2.value; markDirty(); render(); };
  const up = mk("↑", () => move(rec, i, -1)), dn = mk("↓", () => move(rec, i, 1));
  const rm = mk("✕", () => { rec.turns.splice(i, 1); markDirty(); render(); });
  const info = document.createElement("span");
  info.className = "grow";
  info.textContent = `${bytes(t.content)} tokens`;
  hd.append(sel2, up, dn, rm);
  if (isAsst) {
    const lab = document.createElement("label");
    lab.className = "chk train";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = t.role === "assistant";
    cb.onchange = () => {
      t.role = cb.checked ? "assistant" : "assistant_context";
      markDirty(); render();
    };
    lab.append(cb, document.createTextNode("train on this"));
    lab.title = "off: the model reads this turn but is never trained to write it";
    hd.appendChild(lab);
  }
  hd.appendChild(info);
  const ta = document.createElement("textarea");
  ta.value = t.content;
  ta.rows = 2;
  ta.placeholder = t.role === "tool" ? "what the call returned" : "";
  ta.oninput = () => {
    shiftMasks(t, t.content, ta.value);
    t.content = ta.value;
    info.textContent = `${bytes(ta.value)} tokens`;
    autosize(ta);
    markDirty();
    renderMasks();
    renderWire();
  };
  d.append(hd, ta);

  const masks = document.createElement("div");
  masks.className = "masks";
  if (t.role === "assistant") d.appendChild(masks);

  // The selection is grown to word borders first: a mask that ends inside a
  // word would be rounded out by the segmentation anyway, so rounding it here
  // keeps what is shown and what is trained the same thing.
  const apply = (mask) => () => {
    const [s, e] = snap(ta.value, ta.selectionStart, ta.selectionEnd);
    if (e <= s) { setStatus("select the text first (or put the cursor in a word)", true); return; }
    t.no_loss = mask ? normalize([...t.no_loss, [s, e]]) : subtract(t.no_loss, s, e);
    markDirty(); renderMasks(); renderWire(); renderList();
  };

  function renderMasks() {
    masks.innerHTML = "";
    if (t.role !== "assistant") return;
    const bar = document.createElement("div");
    bar.className = "maskbar";
    const cut = document.createElement("button");
    cut.className = "icon";
    cut.textContent = "don't train selection";
    cut.onclick = apply(true);
    bar.appendChild(cut);
    if (t.no_loss.length) {
      const back = document.createElement("button");
      back.className = "icon";
      back.textContent = "train selection";
      back.onclick = apply(false);
      const all = document.createElement("button");
      all.className = "icon";
      all.textContent = "clear masks";
      all.onclick = () => { t.no_loss = []; markDirty(); renderMasks(); renderWire(); renderList(); };
      bar.append(back, all);
    }
    masks.appendChild(bar);
    t.no_loss.forEach(([a, b]) => {
      const chip = document.createElement("span");
      chip.className = "chip";
      const text = t.content.slice(a, b).trim();
      chip.textContent = text.length > 48 ? text.slice(0, 45) + "…" : text;
      chip.title = "not trained — click to train it again";
      chip.onclick = () => { t.no_loss = subtract(t.no_loss, a, b); markDirty(); renderMasks(); renderWire(); renderList(); };
      masks.appendChild(chip);
    });
  }
  renderMasks();

  setTimeout(() => autosize(ta));
  return d;
}

function mk(text, fn) {
  const b = document.createElement("button");
  b.className = "icon";
  b.textContent = text;
  b.onclick = fn;
  return b;
}

function move(rec, i, d) {
  const j = i + d;
  if (j < 0 || j >= rec.turns.length) return;
  [rec.turns[i], rec.turns[j]] = [rec.turns[j], rec.turns[i]];
  markDirty(); render();
}

function renderWire() {
  const pre = $("wire");
  if (!pre) return;
  const rec = records[sel];
  const { seg, warn } = assemble(rec);
  const showWs = $("ws").checked;
  pre.innerHTML = "";
  let total = 0;
  for (const s of seg) {
    total += bytes(s.text);
    const span = document.createElement("span");
    span.className = s.cls;
    if (showWs && !s.cls.includes("m")) {
      span.innerHTML = s.text
        .replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c])
        .replace(/ /g, '<span class="ws">·</span>')
        .replace(/\t/g, '<span class="ws">→</span>')
        .replace(/\n/g, '<span class="ws">¶</span>\n');
    } else {
      span.textContent = s.text;
    }
    pre.appendChild(span);
  }
  if (!seg.length) pre.textContent = "(nothing survives — see below)";
  const w = $("warn");
  w.innerHTML = "";
  const info = document.createElement("div");
  // Bytes are tokens (the tokenizer is byte-level). The cap that really binds
  // is SFT_MAX_WORDS, ~3-4 bytes per word on this data.
  const words = Math.round(total / 3.5);
  const over = total > MAX_TOKENS || words > MAX_WORDS;
  info.style.color = over ? "var(--warn)" : "var(--dim)";
  info.textContent = `${total} tokens · ~${words} words` +
    (over ? ` — over the cap (${MAX_WORDS} words / ${MAX_TOKENS} tokens), dropped at load` : "");
  w.appendChild(info);
  warn.forEach((t) => {
    const d = document.createElement("div");
    d.textContent = "! " + t;
    w.appendChild(d);
  });
}

// io

async function load() {
  const text = await (await fetch("/api/file")).text();
  records = parse(text);
  sel = 0;
  dirty = false;
  setStatus(`loaded ${records.length} records`);
  render();
}

async function save() {
  const res = await fetch("/api/file", { method: "POST", body: serialize() });
  const msg = await res.text();
  dirty = false;
  setStatus(msg, msg.startsWith("save failed"));
  renderList();
}

$("save").onclick = save;
$("ws").onchange = renderWire;
$("new-chat").onclick = () => {
  records.push({
    kind: "chat", category: "",
    turns: [{ role: "user", content: "", no_loss: [] }, { role: "assistant", content: "", no_loss: [] }],
  });
  sel = records.length - 1; markDirty(); render();
};
$("new-sft").onclick = () => {
  records.push({ kind: "sft", category: "", instruction: "", context: "", response: "" });
  sel = records.length - 1; markDirty(); render();
};
$("dup").onclick = () => {
  if (!records[sel]) return;
  records.splice(sel + 1, 0, JSON.parse(JSON.stringify(records[sel])));
  sel += 1; markDirty(); render();
};
$("del").onclick = () => {
  if (!records[sel]) return;
  records.splice(sel, 1);
  sel = Math.max(0, Math.min(sel, records.length - 1));
  markDirty(); render();
};
addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); }
});
addEventListener("beforeunload", (e) => { if (dirty) e.preventDefault(); });
load();
</script>
