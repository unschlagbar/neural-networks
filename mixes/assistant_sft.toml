#:schema ../datamix/mixture.schema.json
# SFT mixture for the assistant: tool calls it can only learn from synthetic
# data, plus general instruction following so it still answers in words.
#
#   cargo run -p datamix --release -- sample mixes/assistant_sft.toml -n 8
#   cargo run -p datamix --release -- build  mixes/assistant_sft.toml

[output]
kind = "sft"
path = "data/mix/assistant.jsonl"
report = "data/mix/assistant_report.md"
seed = 1234
shuffle = true
holdout = 0.02

[filter]
# The real cap is in WORDS — the unit the backbone unrolls in — matching
# SFT_MAX_WORDS / WORDS_PER_SEQ in src/config.rs, counted with the model's own
# splitter. The token cap behind it only guards pathological words.
max_words = 4096
max_tokens = 28672
min_bytes = 8
dedup = "exact"

[source.lamp]
kind = "synth"
path = "mixes/synth/lamp.syn"
count = 4000
weight = 3
epochs = 2

[source.apps]
kind = "synth"
path = "mixes/synth/apps.syn"
count = 3000
weight = 3
epochs = 4

# Follow-ups ("dimmer", "make it red") are what a single-turn corpus cannot
# teach: the model has to resolve "it" against what was said a turn earlier.
[source.tools_in_context]
kind = "synth"
path = "mixes/synth/tools_in_context.syn"
count = 0
epochs = 4
weight = 2

[source.text_edit]
kind = "synth"
path = "mixes/synth/text_edit.syn"
count = 600
weight = 1
epochs = 8       # only a handful of hand-written pairs: repeat them

# General instruction data so the model does not collapse into a tool-call
# emitter. Point this at a dolly-style JSONL; drop the table if you have none.
# [source.dolly]
