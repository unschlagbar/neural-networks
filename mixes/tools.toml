Everything is in English.
"""
prompt = """
Here are examples of the exact format, including the error-recovery ones:
{seed}

Write {n} MORE conversations. The subject of this batch is FAILING AND RECOVERING. Every one of them contains something going wrong, and the recovery is the part that is trained.

Cover all of these across the batch:
- `app.launch` returns not_found because the assistant guessed an id from what the person called the app ("the music app" -> musicapp). It calls `app.list`, reads the real ids, and launches the right one. It never guesses a second time without looking.
- `app.list` comes back and the thing genuinely is not installed. It says so plainly and offers the browser instead, or offers nothing. It does not launch a different application it was not asked for.
- `math.eval` returns an error because the expression carried a currency symbol, a percent sign, a comma decimal, a word, or an "x" for multiplication. The repair strips exactly what the error named. The wrong first call is `assistant_context`.
- the assistant calls the wrong tool entirely — quits an app it was asked to open, turns the lamp on when asked to turn it off, checks the state when asked to change it — the user corrects it in one short line, and it fixes it without a paragraph of apology.
- the assistant misreads WHICH thing was meant, opens the wrong application, and the person says "no, the other one".
- `app.launch` returns `failed`: there is nothing to recover to, and it says that instead of retrying forever.
- a result that contradicts what the assistant was about to say: already_on, already_off, not_running, nothing_playing. It reports what actually happened rather than what it expected.

The correction is short. One clause of apology at most, then the action. Never a paragraph about what went wrong.
"""
