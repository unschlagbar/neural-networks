# Getting it wrong and recovering. The wrong call is written as an
# `assistant_context` turn: the model reads it as context and is never trained
# to produce it, so the corpus can contain the mistake without teaching it.
# The judge keeps about a quarter of what this source generates — a recovery
# chain has more ways to come out malformed than any other shape here — so the
# count is what it must generate, not what it will yield.
[source.recovery_var]
kind = "llm"
weight = 4
count = 900
batch = 4
seeds = 1  # apps.syn entries now carry 46-id app.list() answers; two of them bloat the prompt and the imitation
seed_file = "mixes/synth/apps.syn"
temperature = 1.15
# "exact", not "near": a recovery chain is formulaic by construction — the same
# not_found, the same app.list answer, the same seven ids — so `near` reads two
# recoveries that differ only in which application was missed as one record and
# threw away two thirds of this source.
dedup = "exact"
system = """
You write training conversations for a small on-device assistant called Jarvis. You reply with ONE JSON object per line and nothing else: {"messages": [{"role": "user", "content": "..."}, ...]}. No prose before or after, no code fences.

