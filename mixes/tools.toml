prompt = """
Here are examples of the exact format:
{seed}

Write {n} MORE conversations for the same tools. The subject of this batch is WHERE the tool call sits. Never put it in the first assistant turn: every conversation here must have something before the call — a system message, or at least one ordinary exchange. A single question-and-call conversation is not what this batch is for and will be thrown away.

Use all of these, spread across the batch:
- a filled "system" message — a persona, a house rule, a note about the user's preferences, a paragraph of unrelated project context — and then a request that still gets called on
- three to six turns of ordinary conversation first (a question about Rust, a complaint about the weather, a recipe, a bug the person is chasing) and the tool call arriving mid-conversation, then the ordinary conversation resuming afterwards as if nothing special happened
- a request pasted inside something else: an email the person is drafting, a log they pasted, a shopping list, a code block — where one line of it is the thing they actually want done
- a follow-up that only makes sense from the earlier turns: "do that again", "the other one too", "put it back", "and split that by four", "now close it"
- a conversation where the person asks for a thing, changes their mind mid-sentence, and the assistant acts on the version they landed on

The assistant answers in ONE short sentence after each result, and picks the ordinary conversation back up in its own register. It never announces that it is about to use a tool.
"""
