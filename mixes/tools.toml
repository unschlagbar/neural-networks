# Arithmetic that arrives as a life question rather than as a sum. The template
# file has twelve shapes of this; what it cannot produce is the thousandth one.
[source.math_var]
kind = "llm"
weight = 5
count = 800
batch = 5
seeds = 3
seed_file = "mixes/synth/math.syn"
temperature = 1.05
